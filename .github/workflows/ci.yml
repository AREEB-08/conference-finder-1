name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same branch to save queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets are needed. Without Google Sheets credentials the data layer
      # falls back to the bundled sample rows, so the build still exercises
      # every page, including the prerendered detail routes.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
